# Kubeconfig for the source cluster, stored in the source-cluster Secret.
# It authenticates with Application Default Credentials. Inside the controller
# pod, ADC is provided by Workload Identity, so no user credentials are embedded.
# Placeholders are filled in by render_template in krmsyncer.sh.
apiVersion: v1
kind: Config
clusters:
- name: source
  cluster:
    server: https://${SOURCE_ENDPOINT}
    certificate-authority-data: ${SOURCE_CA_DATA}
contexts:
- name: source
  context:
    cluster: source
    user: source
current-context: source
users:
- name: source
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: gke-gcloud-auth-plugin
      args:
      - --use_application_default_credentials
      provideClusterInfo: true
      interactiveMode: Never
